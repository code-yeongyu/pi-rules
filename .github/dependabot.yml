version: 2
updates:
  # Updates package.json and package-lock.json, the only lockfile. CI and
  # bun-based installs read package-lock.json, so nothing else can drift.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
